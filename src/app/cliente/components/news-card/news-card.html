<article class="news-card">
  <a [routerLink]="news().route" class="card-image" [attr.aria-label]="news().title">
    <img [src]="news().image" [alt]="news().title" loading="lazy" />
  </a>

  <div class="card-body">
    <div class="meta-line">
      @if (news().region) {
        <a [routerLink]="news().categoryRoute || news().route" class="meta-link">{{ news().region }}</a>
        <span class="separator">/</span>
      }
      <a [routerLink]="news().categoryRoute || news().route" class="meta-link">{{ news().category }}</a>
    </div>

    <h3>
      <a [routerLink]="news().route" class="title-link">{{ news().title }}</a>
    </h3>

    <p>{{ news().excerpt }}</p>
  </div>
</article>
